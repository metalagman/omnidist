name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows_arm64:
    name: npm launcher on Windows ARM64
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v4

    - name: Set up native ARM64 Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        architecture: arm64

    - name: Set up native ARM64 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        architecture: arm64
        package-manager-cache: false

    - name: Verify native Windows ARM64 launch
      shell: pwsh
      run: |
        node -e "if (process.platform !== 'win32' || process.arch !== 'arm64') process.exit(1)"
        if ($LASTEXITCODE -ne 0) { throw 'Native Windows ARM64 Node.js is required' }
        if ((go env GOOS) -ne 'windows' -or (go env GOARCH) -ne 'arm64') { throw 'Native Windows ARM64 Go is required' }
        go test -v ./internal/workflow/npm -run '^TestNPMShim' -count=1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.out
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
